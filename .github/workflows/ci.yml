name: Rust SDK checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - run: cargo +1.90.0 fmt --check
      - run: cargo +1.90.0 clippy --all-features --all-targets --locked -- -D warnings
      - run: cargo +1.90.0 test --all-features --locked
      - run: cargo +1.90.0 package --locked
