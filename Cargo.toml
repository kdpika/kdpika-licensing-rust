[package]
name = "kdpika-licensing"
version = "0.1.1"
edition = "2021"
rust-version = "1.90"
description = "Official KDPika Licensing client: signed activation, validation and bounded offline access"
license = "MIT"
publish = ["crates-io"]
readme = "README.md"
homepage = "https://licensing.kdpika.com"
repository = "https://github.com/kdpika/kdpika-licensing-rust"
documentation = "https://licensing.kdpika.com/docs/v1/sdks/rust"
keywords = ["licensing", "license", "ed25519", "activation", "sdk"]
categories = ["api-bindings", "authentication"]
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "SECURITY.md", "CHANGELOG.md"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
async = ["dep:tokio"]

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
ed25519-dalek = "2.2.0"
fs2 = "0.4.3"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value", "arbitrary_precision"] }
sha2 = "0.10.9"
tempfile = "3.23"
tokio = { version = "1.48", optional = true, features = ["sync"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time"] }

[[example]]
name = "async_session"
required-features = ["async"]
